<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The Content-Security-Policy is NOT declared here. It ships as a `Content-Security-Policy`
      response header injected by the main process (`session.webRequest.onHeadersReceived`, see
      `src/shared/csp.ts` and `src/main/security/csp.ts`), so Electron's security advisory detects it
      and the renderer can never run a frame without the header regardless of how it is loaded
      (packaged `file://`, dev server, splash). Keep that policy string and `src/renderer/
      __tests__/csp.test.ts` in sync - in particular `font-src 'self' data:` (bundled fonts are
      inlined as data: URIs) and `connect-src 'self' aptabase-ipc:` (renderer analytics).
    -->
    <title>EncodeX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `font-src` is required, not optional: Vite inlines the @fontsource Roboto
      subsets below its 4 KB asset limit as `data:` URIs, and without an explicit
      `font-src` they fall back to `default-src 'self'` and get blocked. That
      shipped a build where every label rendered in a fallback face while the
      console filled with CSP violations. `data:` is required for the same
      reason `img-src` already allows it; the fonts are bundled, not remote.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' aptabase-ipc:"
    />
    <title>EncodeX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

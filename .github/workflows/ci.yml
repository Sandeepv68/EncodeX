name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  format-check:
    name: Check - Code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Check - ESLint (a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  lint-px:
    name: Check - No hardcoded px
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:px

  lint-colors:
    name: Check - No hardcoded colors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:colors

  lint-rem:
    name: Check - No hardcoded rem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:rem

  lint-inline-styles:
    name: Check - No inline styles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:inline-styles

  lint-strings:
    name: Check - No hardcoded UI strings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:strings

  lint-unused:
    name: Check - No unused declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:unused:test
      - run: npm run lint:unused

  lint-aptabase:
    name: Check - No direct @aptabase imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:aptabase:test
      - run: npm run lint:aptabase

  typecheck:
    name: Check - TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  validate-locales:
    name: Check - Validate locales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run validate:locales

  audit:
    name: Check - Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking: npm audit --audit-level=high still exits non-zero (1 high
    # + 6 moderate, electron-builder already at 26.x). See
    # plans/CI_IMPROVEMENTS.md O1 + plans/CI_CD_EXPANSION_PLAN.md N4. Flip
    # continue-on-error to false once the audit exits 0.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit
        run: npm audit --audit-level=high

  actionlint:
    name: Check - GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          actionlint_flags: -color

  build:
    name: Build - ${{ matrix.os }}
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-strings, lint-unused, lint-aptabase, typecheck, validate-locales, actionlint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  test-unit:
    name: Test - Unit Tests (coverage)
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-strings, lint-unused, lint-aptabase, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  test-integration:
    name: Test - Integration Tests
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-strings, lint-unused, lint-aptabase, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  test-fuzz:
    name: Test - Media Fuzz
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-strings, lint-unused, lint-aptabase, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run media fuzz tier (corrupt-media corpus, real ffmpeg/ffprobe binaries)
        run: npm run test:media-fuzz

  test-locale-matrix:
    # Phase 5.1 gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10): every
    # routed page rendered under the real i18next instance in every one of the
    # 56 shipped locales, plus the RTL mirror suite (direction wiring, emotion
    # rtl-cache CSS flip, pages under the rtl cache, ltr/rtl shortcut parity),
    # plus the longest-string stress (de-DE + 3x synthetic pseudo-locale).
    # Runs in its own job because 56 x 12 mounts with real i18next would slow
    # the shared unit tier to minutes.
    name: Test - i18n matrix (56 locales x 12 routes) + RTL mirror + longest-string
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-strings, lint-unused, lint-aptabase, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run locale matrix + RTL mirror (real i18next, 56 locales x 12 routes)
        run: npm run test:locale-matrix

  coverage-per-file:
    name: Report - Per-file coverage floors
    needs: [format-check, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Informational only. The per-file numbers describe a ratchet to climb, not
    # a gate to satisfy: 30 files sit below the candidate 80/70 floor today, so
    # making this blocking would fail every PR until all of them are fixed.
    # Promote it to blocking once the floor is met repo-wide.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate merged per-file report (unit + integration)
        # test:integration builds the main process itself, so no separate build.
        run: npm run test:coverage:perfile 2>&1 | tee per-file-coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: per-file-coverage
          path: |
            per-file-coverage.txt
            coverage/
            coverage-integration/
          if-no-files-found: warn

  coverage-diff:
    name: Gate - Diff coverage
    needs: [format-check, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gate can diff against the base branch. Without
          # it the base lookup falls through to HEAD, the diff comes back empty,
          # and the gate reports "nothing to gate" and passes every PR.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build main process (integration tier imports it)
        run: npm run build:main
      - name: Enforce coverage floor and added-line coverage on changed files
        env:
          # Pin the base instead of relying on auto-detection: a mis-resolved
          # base produces an empty diff, which this gate treats as a pass.
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/coverage-diff.mjs "$COVERAGE_BASE"

  test-flake:
    name: Test - Flake detection (e2e x3)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu
          path: dist
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Three passes, retries disabled (see scripts/flake-detect.mjs). CI sets
      # retry: 2 for the normal e2e job, which is right there and useless here:
      # it would convert a one-in-three failure into a green result.
      - name: Run e2e three times and fail on intermittent results
        run: xvfb-run --auto-servernum npm run test:flake-detect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake-report
          path: |
            reports/flake.json
            reports/flake/
          if-no-files-found: warn

  test-mcp-smoke:
    name: Test - MCP server smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu
          path: dist
      - run: npm ci
      - name: Smoke test standalone stdio server
        run: npm run mcp:smoke
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke test Electron --mcp mode
        run: xvfb-run --auto-servernum npm run mcp:smoke:electron -- --no-sandbox

  test-perf:
    name: Test - Performance Benchmarks
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-strings, lint-unused, lint-aptabase, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate test media fixtures
        run: npm run perf:generate-media
      - name: Run performance tests
        run: npm run perf
      - name: Compare against baseline (regression gate)
        run: npm run perf:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf/results/
          if-no-files-found: warn

  test-e2e:
    name: Test - E2E Automation (${{ matrix.os }})
    needs: [build, test-unit, test-integration]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - run: npm ci
      - name: Install xvfb
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run e2e tests (Linux)
        if: matrix.os == 'ubuntu'
        run: xvfb-run --auto-servernum npm run test:e2e:ci
      - name: Run e2e tests (Windows)
        if: matrix.os == 'windows'
        run: npm run test:e2e:ci

  test-e2e-real:
    name: Test - E2E Production Scenario
    needs: [build, test-unit, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist-ubuntu
          path: dist
      - run: npm ci
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run real conversion e2e
        run: xvfb-run --auto-servernum npm run test:e2e:real:ci

  test-ipc-abuse:
    # Phase 3 adversarial gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10):
    # the Tier B IPC handler-abuse sweep driven through the *real* preload +
    # real main, on both platforms the release supports. The cheaper unit-tier
    # equivalent runs in test-unit; this job is the faithful surface.
    name: Test - IPC abuse (real main, ${{ matrix.os }})
    needs: [build, test-unit, test-integration]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - run: npm ci
      - name: Install xvfb
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run IPC abuse sweep (Linux)
        if: matrix.os == 'ubuntu'
        run: xvfb-run --auto-servernum npm run test:e2e:real:ci e2e/specs/ipc-abuse.spec.ts
      - name: Run IPC abuse sweep (Windows)
        if: matrix.os == 'windows'
        run: npm run test:e2e:real:ci e2e/specs/ipc-abuse.spec.ts

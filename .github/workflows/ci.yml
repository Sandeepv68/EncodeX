name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '*.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'assets/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  format-check:
    name: Check - Code formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Check - ESLint (a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  lint-px:
    name: Check - No hardcoded px
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:px

  lint-colors:
    name: Check - No hardcoded colors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:colors

  lint-rem:
    name: Check - No hardcoded rem
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:rem

  lint-inline-styles:
    name: Check - No inline styles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:inline-styles

  lint-types:
    name: Check - No local type declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Type declarations live in type files (types.ts / *.types.ts); implementation
    # files only describe what they do. The rule's own unit test runs first so a
    # broken rule fails here instead of silently passing every file.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:types:test
      - run: npm run lint:types

  lint-strings:
    name: Check - No hardcoded UI strings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:strings

  lint-unused:
    name: Check - No unused declarations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:unused:test
      - run: npm run lint:unused

  lint-aptabase:
    name: Check - No direct @aptabase imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:aptabase:test
      - run: npm run lint:aptabase

  lint-regex:
    name: Check - No super-linear backtracking regexes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:regex

  typecheck:
    name: Check - TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  validate-locales:
    name: Check - Validate locales
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run validate:locales

  doc-drift:
    name: Check - Documentation drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Verifies that every `<!-- drift:key=value -->` marker in wiki/, docs/ and
    # site/ still matches the value recomputed from the source tree.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run doc:drift
      - run: npm run doc:drift:test

  audit:
    name: Check - Dependency audit (blocking, exception-listed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Blocking since Phase 10 (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10):
    # `npm audit` alone still exits non-zero on a known, tracked set of dev-
    # toolchain advisories (vite/vue/source-map-js, @modelcontextprotocol/sdk,
    # shell-quote/concurrently -- see scripts/audit-allowlist.json). The gate
    # fails on any NEW high/critical advisory not on that list, which is the
    # plan's "blocking with a documented exception list" (supersedes
    # CI_IMPROVEMENTS.md O1 + CI_CD_EXPANSION_PLAN.md N4 "flip when exit 0").
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Blocking audit gate (new high/critical fails)
        run: npm run audit:gate

  actionlint:
    name: Check - GitHub Actions workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: reviewdog/action-actionlint@48e36f54d8da326b83ab061aee2cc5e01b5ca46f # v1
        with:
          actionlint_flags: -color

  build:
    name: Build - ${{ matrix.os }}
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: macos
            runner: macos-latest
    # Exposed so the build-time Codecov bundle analysis (vite plugin) uploads.
    # Unset/empty on fork PRs and local `act` runs, where it self-disables.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  test-unit:
    name: Test - Unit Tests (coverage)
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Exposed at job level so the step-level `if` can read it: a step's own
    # `env` is not visible to that step's `if`, and the `secrets` context is
    # not allowed in `if` at all. Empty (thus the upload self-skips) when the
    # secret is unset, e.g. local `act` runs and fork PRs.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        # `always()` so a flaky unit test (or any earlier failure) still uploads
        # the coverage vitest already wrote, matching the artifact step above.
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Test Analytics: feeds Vitest's junit.xml (builtin junit reporter in
        # vitest.config.ts) to Codecov for flakiness/failure-rate insights.
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: junit.xml

  test-integration:
    name: Test - Integration Tests
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Exposed so the integration-tier coverage upload (distinct Codecov flag)
    # can authenticate. Empty on fork PRs and local `act` runs -> self-skips.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - name: Upload coverage to Codecov (integration flag)
        if: always() && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration/lcov.info
          flags: integration
          fail_ci_if_error: false

  test-fuzz:
    name: Test - Media Fuzz
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run media fuzz tier (corrupt-media corpus, real ffmpeg/ffprobe binaries)
        run: npm run test:media-fuzz

  test-locale-matrix:
    # Phase 5.1 gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10): every
    # routed page rendered under the real i18next instance in every one of the
    # 56 shipped locales, plus the RTL mirror suite (direction wiring, emotion
    # rtl-cache CSS flip, pages under the rtl cache, ltr/rtl shortcut parity),
    # plus the longest-string stress (de-DE + 3x synthetic pseudo-locale).
    # Runs in its own job because 56 x 12 mounts with real i18next would slow
    # the shared unit tier to minutes.
    name: Test - i18n matrix (56 locales x 12 routes) + RTL mirror + longest-string
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run locale matrix + RTL mirror (real i18next, 56 locales x 12 routes)
        run: npm run test:locale-matrix

  test-a11y:
    # Phase 5.3 gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10): axe in
    # strict mode on every routed page in both themes at the three layout
    # breakpoints the app ships (320 / 768 / 1440), so the DOM-structural rules
    # (region, landmark-one-main, scrollable-region-focusable) can be judged
    # inside the single <main> landmark the real app provides. Runs as its own
    # job because 72 axe passes are too slow for the shared unit tier.
    name: Test - axe matrix (12 routes x light/dark x 320/768/1440)
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run axe matrix (strict, 12 routes x light/dark x 320/768/1440)
        run: npm run test:a11y

  test-big-lists:
    # Phase 5.2 gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10): renderer
    # stress budgets -- 50,000 log rows and 3,000 MUI job cards -- asserting
    # `performance.now()` bounds and that the queue stays responsive. The
    # 5,000-job render needs a ~6 GB heap (over GitHub's 7 GB ubuntu runner),
    # so the gate renders 3,000 cards and the full-scale render lives in the
    # perf tier (row 8 pattern). Runs as its own job because either render would
    # exhaust a shared unit-tier fork.
    name: Test - big-list render budgets (50k log rows / 3k job cards)
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run big-list render budget suite (strict)
        run: npm run test:big-lists

  test-route-changes:
    # Phase 8 gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 8): the
    # dedicated 1,000-rapid-route-change harness. Mounts the real App shell once
    # and drives 1,000 react-router navigations across all lazy routes while a
    # conversion is RUNNING, proving no listener growth, no error-store fault,
    # and no queue-state corruption. Runs as its own job because it mounts the
    # whole app tree and takes well over a minute on its own.
    name: Test - 1,000 rapid route-change harness
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run rapid route-change harness (strict)
        run: npm run test:route-changes

  coverage-per-file:
    name: Gate - Per-file coverage ratchet
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Blocking. The per-file floor is enforced as a *ratchet* rather than as a
    # fixed 80/70 threshold: a fixed floor could not be switched on while
    # dozens of files still sit below it, so it enforced nothing. The ratchet
    # refuses to let any file lose coverage, holds every new file to the
    # global 80/70 floor, and lists the files that are still grandfathered so
    # they can be lifted one at a time.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run the unit and integration coverage tiers
        # test:integration builds the main process itself, so no separate build.
        run: npm run test:coverage && npm run test:integration
      - name: Enforce the per-file coverage ratchet
        # The baseline is recorded per platform, because branch coverage
        # depends on `process.platform`. This job measures on Linux, so it is
        # compared against the Linux entry rather than against whichever
        # platform recorded the baseline.
        env:
          COVERAGE_PLATFORM: linux
        run: npm run test:coverage:floor
      - name: Report the files still below the global floor (informational)
        run: node scripts/coverage-floor-report.mjs 2>&1 | tee per-file-coverage.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: per-file-coverage
          path: |
            per-file-coverage.txt
            coverage/
            coverage-integration/
          if-no-files-found: warn

  coverage-diff:
    name: Gate - Diff coverage
    needs: [format-check, lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the gate can diff against the base branch. Without
          # it the base lookup falls through to HEAD, the diff comes back empty,
          # and the gate reports "nothing to gate" and passes every PR.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build main process (integration tier imports it)
        run: npm run build:main
      - name: Enforce coverage floor and added-line coverage on changed files
        env:
          # Pin the base instead of relying on auto-detection: a mis-resolved
          # base produces an empty diff, which this gate treats as a pass.
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/coverage-diff.mjs "$COVERAGE_BASE"

  test-flake:
    name: Test - Flake detection (e2e x3)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-ubuntu
          path: dist
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      # Three passes, retries disabled (see scripts/flake-detect.mjs). CI sets
      # retry: 2 for the normal e2e job, which is right there and useless here:
      # it would convert a one-in-three failure into a green result.
      - name: Run e2e three times and fail on intermittent results
        run: xvfb-run --auto-servernum npm run test:flake-detect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: flake-report
          path: |
            reports/flake.json
            reports/flake/
          if-no-files-found: warn

  test-mcp-smoke:
    name: Test - MCP server smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-ubuntu
          path: dist
      - run: npm ci
      - name: Smoke test standalone stdio server
        run: npm run mcp:smoke
      - name: Probe the raw stdio protocol
        run: node scripts/mcp-raw-probe.mjs
      - name: Verify the MCP App view documents
        # The unit tier checks the view *contract* against a fixture; this step
        # checks the real bundle the server serves: self-contained, mounting
        # the view it is addressed to, and inside the size budget.
        run: npm run mcp:host-check
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Smoke test Electron --mcp mode
        run: xvfb-run --auto-servernum npm run mcp:smoke:electron -- --no-sandbox

  test-perf:
    name: Test - Performance Benchmarks
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate test media fixtures
        run: npm run perf:generate-media
      - name: Run performance tests
        run: npm run perf
      - name: Compare against baseline (regression gate)
        run: npm run perf:compare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-results
          path: perf/results/
          if-no-files-found: warn

  mutation-scope:
    # Phase 9 gate, CI-cost pass (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 9):
    # plans the mutation run. On a PR only the in-scope files the branch touched
    # are mutated (a one-file PR pays for a handful of mutants, not ~6k), and the
    # work is split into shards (MUTATION_SHARDS) that run on parallel runners.
    # The weekly mutation-ratchet workflow still runs the full scope.
    name: Gate - Mutation scope (plan shards)
    needs: [format-check, lint, lint-px, lint-colors, lint-rem, lint-inline-styles, lint-types, lint-strings, lint-unused, lint-aptabase, lint-regex, typecheck, validate-locales, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shard_count: ${{ steps.scope.outputs.shard_count }}
      has_mutants: ${{ steps.scope.outputs.has_mutants }}
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The scope is the diff against the base commit, so the base must be
          # fetched; `hashFiles` for the cache keys also reads the worktree.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # No `npm ci`: the scope script imports only stryker.config.mjs (a pure
      # object) and Node built-ins, so it runs on a bare runner.
      - name: Resolve scope and shards
        id: scope
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MUTATION_SHARDS: '4'
        run: node scripts/mutation-scope.mjs --github-output

  test-mutation-delta:
    # Phase 9 gate: one job per shard, run in parallel instead of one 6h job.
    # Each shard mutates its own disjoint file set (`--mutate`) with the same
    # narrowed vitest tier; `mutation-gate` stitches the reports and compares.
    #
    # Blocking once a baseline is committed. Until `mutation/baseline.json`
    # exists there is no number to regress from, so a shard failure has
    # nothing to compare and the run stays advisory - recording the first
    # baseline is the job of the weekly Mutation Ratchet workflow, and
    # committing it arms this gate.
    name: Test - Mutation shard ${{ matrix.shard }}
    needs: [mutation-scope]
    if: needs.mutation-scope.outputs.has_mutants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check whether a mutation baseline is committed
        id: baseline
        run: |
          if [ -f mutation/baseline.json ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Mutation gate not armed::No mutation/baseline.json is committed, so there is no score to regress from. This run is advisory until the weekly Mutation Ratchet workflow records and a PR commits the first baseline."
          fi
      - name: Restore Stryker incremental state (shard ${{ matrix.shard }})
        # Keyed per shard: each shard owns a slice of the incremental file, and
        # the restore-key lets a re-shuffled slice reuse the previous run's work.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .stryker/incremental.json
          key: stryker-incremental-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('stryker.config.mjs', 'vitest.mutation.config.ts', 'package-lock.json') }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-shard${{ matrix.shard }}-
      - name: Run mutation testing (shard ${{ matrix.shard }})
        continue-on-error: ${{ steps.baseline.outputs.armed != 'true' }}
        run: npm run test:mutate -- --concurrency 4 --mutate "${{ matrix.files }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: warn

  mutation-gate:
    # Phase 9 gate fan-in: merge the shard reports, then compare per-file against
    # the committed baseline. A missing shard fails the merge instead of
    # recording a partial score.
    #
    # Blocking once `mutation/baseline.json` is committed; before that there is
    # no score to regress from, so the gate reports the current number and
    # passes.
    name: Gate - Mutation score delta
    needs: [mutation-scope, test-mutation-delta]
    if: always() && needs.mutation-scope.outputs.has_mutants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-report-shard-*
          path: shards
      - name: Check whether a mutation baseline is committed
        id: baseline
        run: |
          if [ -f mutation/baseline.json ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge shard reports
        if: steps.baseline.outputs.armed == 'true'
        run: node scripts/mutation-merge.mjs shards --expect ${{ needs.mutation-scope.outputs.shard_count }}
      - name: Compare against baseline (delta gate)
        if: steps.baseline.outputs.armed == 'true'
        run: npm run test:mutation-delta
      - name: Report that the gate is not armed yet
        if: steps.baseline.outputs.armed != 'true'
        run: |
          echo "::notice title=Mutation gate not armed::No mutation/baseline.json is committed, so the mutation score has no recorded floor yet. Commit the candidate the weekly Mutation Ratchet workflow produces to arm this gate."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn

  test-e2e:
    name: Test - E2E Automation (${{ matrix.os }})
    needs: [build, test-unit, test-integration]
    runs-on: ${{ matrix.runner }}
    # The Copilot page's decorative glow is deliberately expensive to
    # rasterise (a full-bleed blur plus animated filters and border-radius).
    # On a GPU-less runner that costs real wall-clock time, so the job needs
    # more headroom than the default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - run: npm ci
      - name: Install xvfb
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run e2e tests (Linux)
        if: matrix.os == 'ubuntu'
        run: xvfb-run --auto-servernum npm run test:e2e:ci
      - name: Run e2e tests (Windows)
        if: matrix.os == 'windows'
        run: npm run test:e2e:ci

  test-e2e-real:
    name: Test - E2E Production Scenario
    needs: [build, test-unit, test-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-ubuntu
          path: dist
      - run: npm ci
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run real conversion e2e
        run: xvfb-run --auto-servernum npm run test:e2e:real:ci

  test-ipc-abuse:
    # Phase 3 adversarial gate (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10):
    # the Tier B IPC handler-abuse sweep driven through the *real* preload +
    # real main, on both platforms the release supports. The cheaper unit-tier
    # equivalent runs in test-unit; this job is the faithful surface.
    name: Test - IPC abuse (real main, ${{ matrix.os }})
    needs: [build, test-unit, test-integration]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - run: npm ci
      - name: Install xvfb
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run IPC abuse sweep (Linux)
        if: matrix.os == 'ubuntu'
        run: xvfb-run --auto-servernum npm run test:e2e:real:ci e2e/specs/ipc-abuse.spec.ts
      - name: Run IPC abuse sweep (Windows)
        if: matrix.os == 'windows'
        run: npm run test:e2e:real:ci e2e/specs/ipc-abuse.spec.ts

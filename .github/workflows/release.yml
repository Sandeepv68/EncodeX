name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  validate-version:
    # Phase 10 (plans/ADVERSARIAL_TEST_HARDENING_PLAN.md row 10): a tag cannot
    # be cut with a red adversarial suite, so the release gates on the fuzz,
    # strict, and real-main IPC-abuse passes before packaging even starts.
    name: Validate tag matches package.json (after adversarial gates)
    needs: [test-fuzz, test-strict, test-ipc-abuse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert v<package.json.version> equals tag
        run: |
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version (expected $expected)"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version"

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          if-no-files-found: error

  test-fuzz:
    name: Gate - Media fuzz (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run media fuzz tier (corrupt-media corpus, real ffmpeg/ffprobe)
        run: npm run test:media-fuzz

  test-strict:
    name: Gate - Strict unit + integration (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENCODEX_STRICT_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run unit tier with strict tripwires
        run: npm test
      - name: Run integration tier with strict tripwires
        run: npm run test:integration

  test-ipc-abuse:
    name: Gate - IPC abuse (real main, ${{ matrix.os }}) (blocking)
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
      - run: npm ci
      - name: Install xvfb
        if: matrix.os == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run IPC abuse sweep (Linux)
        if: matrix.os == 'ubuntu'
        run: xvfb-run --auto-servernum npm run test:e2e:real:ci e2e/specs/ipc-abuse.spec.ts
      - name: Run IPC abuse sweep (Windows)
        if: matrix.os == 'windows'
        run: npm run test:e2e:real:ci e2e/specs/ipc-abuse.spec.ts

  package:
    name: Package - ${{ matrix.os }} (${{ matrix.arch }})
    needs: [validate-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: nsis
            arch: x64
          - os: windows
            runner: windows-latest
            target: nsis
            arch: arm64
          - os: macos
            runner: macos-latest
            target: dmg
            arch: x64
          - os: macos
            runner: macos-latest
            target: dmg
            arch: arm64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: x64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Baked into the packaged app at build time by gen:*-config.
      APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
      APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
      APTABASE_ENVIRONMENT: ${{ secrets.APTABASE_ENVIRONMENT }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ secrets.SENTRY_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch media binaries for ${{ matrix.os }} ${{ matrix.arch }}
        run: node scripts/fetch-media-binaries.mjs --platform=${{ matrix.os }} --arch=${{ matrix.arch }}
      - name: Build ${{ matrix.arch }} ${{ matrix.target }} installer
        run: npm run dist -- --${{ matrix.builder-os || matrix.os }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Smoke test compiled MCP server
        run: npm run mcp:smoke
      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p staging
          installers=(release/*.exe release/*.dmg release/*.AppImage)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No installer artifacts produced in release/"
            exit 1
          fi
          cp "${installers[@]}" staging/
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: staging/
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [package]
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      subject: ${{ steps.subject.outputs.subject }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release-artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts were downloaded"
            exit 1
          fi

          cd release-artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Compute artifact digests
        id: subject
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          DIGESTS=$(sha256sum -- * | base64 -w0)
          echo "subject=$DIGESTS" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ./sbom.cdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**
            sbom.cdx.json

  provenance:
    name: Generate SLSA provenance
    needs: [publish]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.publish.outputs.subject }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

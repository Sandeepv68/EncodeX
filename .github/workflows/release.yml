name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  package:
    name: Package - ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: nsis
            arch: x64
          - os: windows
            runner: windows-latest
            target: nsis
            arch: ia32
          - os: windows
            runner: windows-latest
            target: nsis
            arch: arm64
          - os: macos
            runner: macos-latest
            target: dmg
            arch: x64
          - os: macos
            runner: macos-latest
            target: dmg
            arch: arm64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: x64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: arm64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: armv7l
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch media binaries for ${{ matrix.os }} ${{ matrix.arch }}
        run: node scripts/fetch-media-binaries.mjs --platform=${{ matrix.os }} --arch=${{ matrix.arch }}
      - name: Build ${{ matrix.arch }} ${{ matrix.target }} installer
        run: npm run dist -- --${{ matrix.builder-os || matrix.os }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.blockmap
            release/*.yml
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release-artifacts/**

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: 22

jobs:
  validate-version:
    name: Validate tag matches package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert v<package.json.version> equals tag
        run: |
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version (expected $expected)"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches package.json version"

  package:
    name: Package - ${{ matrix.os }} (${{ matrix.arch }})
    needs: [validate-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            target: nsis
            arch: x64
          - os: windows
            runner: windows-latest
            target: nsis
            arch: arm64
          - os: macos
            runner: macos-latest
            target: dmg
            arch: x64
          - os: macos
            runner: macos-latest
            target: dmg
            arch: arm64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: x64
          - os: ubuntu
            runner: ubuntu-latest
            builder-os: linux
            target: appimage
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Baked into the packaged app at build time by gen:*-config.
      APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
      APTABASE_ENVIRONMENT: production
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch media binaries for ${{ matrix.os }} ${{ matrix.arch }}
        run: node scripts/fetch-media-binaries.mjs --platform=${{ matrix.os }} --arch=${{ matrix.arch }}
      - name: Build ${{ matrix.arch }} ${{ matrix.target }} installer
        run: npm run dist -- --${{ matrix.builder-os || matrix.os }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Smoke test compiled MCP server
        run: npm run mcp:smoke
      - name: Stage installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p staging
          installers=(release/*.exe release/*.dmg release/*.AppImage)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No installer artifacts produced in release/"
            exit 1
          fi
          cp "${installers[@]}" staging/
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: staging/
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [package]
    if: ${{ needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      subject: ${{ steps.subject.outputs.subject }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release-artifacts/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release artifacts were downloaded"
            exit 1
          fi

          cd release-artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Compute artifact digests
        id: subject
        run: |
          cd release-artifacts
          DIGESTS=$(node -e "const fs=require('fs');const cp=require('child_process');const files=fs.readdirSync('.').filter(f=>fs.statSync(f).isFile()).sort();const out=files.map(f=>'sha256:'+cp.execFileSync('sha256sum',[f]).toString().split(/\s+/)[0]);process.stdout.write(Buffer.from(JSON.stringify(out)).toString('base64'))")
          echo "subject=$DIGESTS" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: ./sbom.cdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**
            sbom.cdx.json

  provenance:
    name: Generate SLSA provenance
    needs: [publish]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.publish.outputs.subject }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

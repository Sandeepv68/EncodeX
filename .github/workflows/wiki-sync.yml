name: Sync Wiki

on:
  push:
    branches: [main, master]
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: 22

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  verify:
    name: Verify documentation drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The wiki is mirrored from this repository, so the drift markers in wiki/
    # must match the values recomputed from the source tree before publishing.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run doc:drift

  sync:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout wiki source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: repo
          fetch-depth: 0

      - name: Checkout wiki destination
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sandeepv68/EncodeX.wiki
          path: wiki
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror wiki files
        run: |
          rm -rf wiki/*
          cp -r repo/wiki/* wiki/

      - name: Commit and push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit"
            exit 0
          fi
          git commit -m "Sync wiki with main repo"
          git push origin HEAD
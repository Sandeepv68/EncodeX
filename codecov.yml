coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

# Flags group the two independent test tiers this repo runs. The unit tier
# (`-F unit`) and integration tier (`-F integration`) both measure the same
# src/** file set but exercise different code paths (unit simulates, the
# integration tier drives the real build's CLI/MCP surfaces). Uploading each
# tier as its own flag lets Codecov attribute coverage in PR comments, status
# checks, and source overlay to the tier that produced it. carryforward:true
# keeps flag history from collapsing when a commit only runs part of a suite.
flag_management:
  default_rules: # applied to any flag not named under individual_flags
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: 80%
  individual_flags:
    - name: unit # grips the whole src/ report
      carryforward: true
    - name: integration # flag stats only for the CLI/MCP code this tier targets
      # Scoped to the CLI/MCP surfaces the integration suite actually drives.
      # The rest of src/main (AI connectors, settings IPC, the Electron IPC
      # layer) is reached only through the Electron main process, which the
      # integration tier never boots, so gating its patch coverage here would
      # be permanently unsatisfiable. Those files stay covered by the unit flag.
      paths:
        - src/main/cli/**
        - src/main/mcp/**
        - src/mcp/**
      carryforward: true

# Components are virtual path filters defined entirely here (unlike flags, they
# are not declared at upload time). Both test tiers measure the same src/** file
# set, so components carve that single report into the architectural areas of
# the app. This yields per-area coverage in the PR comment and independent
# project/patch statuses without splitting the uploads.
component_management:
  default_rules: # inherited by every component that does not define its own statuses
    statuses:
      - type: project
        target: auto
        threshold: 1%
      - type: patch
        target: 80%
  individual_components:
    - component_id: main # Electron main process
      name: main
      paths:
        - src/main/**
    - component_id: mcp # embedded + standalone MCP server
      name: mcp
      paths:
        - src/mcp/**
        - src/main/mcp/**
    - component_id: renderer # React UI
      name: renderer
      paths:
        - src/renderer/**
    - component_id: shared # code shared between processes
      name: shared
      paths:
        - src/shared/**
    - component_id: preload # contextBridge surface
      name: preload
      paths:
        - src/preload/**

comment:
  layout: "reach, diff, flags, components, files"
  behavior: default
  require_changes: false